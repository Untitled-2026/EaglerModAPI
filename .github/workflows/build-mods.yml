name: Build Zeus mod packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mod-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package mods
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install Lua 5.4
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4

      - name: Check Lua 5.4 syntax
        run: |
          luac5.4 -p main.lua
          find src examples/consumer -type f -name '*.lua' -print0 | xargs -0 -r -n 1 luac5.4 -p

      - name: Build installable Zeus packages
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            expected_version="${GITHUB_REF_NAME#v}"
            python3 scripts/build_packages.py --output-dir dist --expected-version "$expected_version"
          else
            python3 scripts/build_packages.py --output-dir dist
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: EaglerModAPI-packages-${{ github.sha }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8.0.2
        with:
          name: EaglerModAPI-packages-${{ github.sha }}
          path: dist

      - name: Publish release with ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --title "EaglerModAPI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
